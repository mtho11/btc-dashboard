name: Refresh Market Data

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6am UTC (after prior day's market close)
  workflow_dispatch:       # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch M2 data from FRED
        run: bash scripts/fetch-m2.sh

      - name: Fetch commodity and equity data from Yahoo Finance
        run: python3 scripts/fetch-yahoo.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/m2.json public/silver.json public/oil.json public/spy.json public/qqq.json
          git diff --cached --quiet || git commit -m "chore: refresh market data (M2, silver, oil, equities)"
          git push
