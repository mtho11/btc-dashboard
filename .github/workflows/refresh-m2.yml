name: Refresh Market Data

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6am UTC (after prior day's market close)
  workflow_dispatch:       # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch M2 data from FRED
        run: bash scripts/fetch-m2.sh

      - name: Fetch silver data from Yahoo Finance
        run: |
          python3 -c "
import urllib.request, json

def fetch(symbol, out):
    url = f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=5y'
    req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
    with urllib.request.urlopen(req) as r:
        d = json.load(r)
    result = d['chart']['result'][0]
    timestamps = result['timestamp']
    q = result['indicators']['quote'][0]
    points = []
    for i, t in enumerate(timestamps):
        o, h, l, c = q['open'][i], q['high'][i], q['low'][i], q['close'][i]
        if None in (o, h, l, c): continue
        points.append({'time': t, 'open': round(o,4), 'high': round(h,4), 'low': round(l,4), 'close': round(c,4)})
    points.sort(key=lambda p: p['time'])
    with open(out, 'w') as f:
        json.dump(points, f)
    print(f'{symbol}: {len(points)} pts, last close: {points[-1][\"close\"]}')

fetch('SI=F', 'public/silver.json')
"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/m2.json public/silver.json
          git diff --cached --quiet || git commit -m "chore: refresh market data (M2, silver)"
          git push
