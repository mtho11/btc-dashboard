name: Refresh Market Data

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch M2 data from FRED
        run: bash scripts/fetch-m2.sh

      - name: Fetch gold and silver data from Yahoo Finance
        run: bash scripts/fetch-gold-silver.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/m2.json public/gold.json public/silver.json
          git diff --cached --quiet || git commit -m "chore: refresh market data (M2, gold, silver)"
          git push
